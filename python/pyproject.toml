[project]
name = "quiche"
version = "0.0.1"
description = "QUantum Integrated CHEmistry toolkit."
authors = [
    { name = "Thomas Bromley", email = "thomas@quantummotion.tech"},
    { name = "Annina Lieberherr", email = "annina@quantummotion.tech"},
    { name = "Vasco Ferreira", email = "vasco.ferreira@quantummotion.tech"}
]
license = "Apache-2.0"

# need explicit upper bound due to poetry
requires-python=">=3.12, <4.0"

dependencies = [
    "cirq-core>=1.3",
    "h5py>=3.12",
    "numpy>=2.1, <=2.4",    # required for transitive dependencies
    "pydantic>=2.11",
    "qualtran>=0.6",
    "sympy>=1.12.0",
]

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.15",
]
test = [
    "cudaq>=0.15,<0.16",
    "cudaq-algorithms>=0.1",
    "pytest>=9.0",
    "scipy>=1.15",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "../build/"
cmake.args = ["-DQUICHE_BUILD_BINDINGS=ON"]
cmake.source-dir = "../"
wheel.packages = ["src/quiche"]
wheel.py-api = "cp312"

[tool.ruff]
exclude = ["*.pyi"]    # Ignore auto-generated stubs
lint.select = ["ALL"]
lint.ignore = [
    "T20",    # flake8-print
    "AIR",    # Airflow (not applicable)
    "FAST",   # FastAPI (not applicable)
    "D203",   # conflicts with D211
    "D212",   # conflicts with D213
    "COM812", # conflicts with formatter
    "TD003",   # not applicable
    "FIX002",  # not applicable
    "PLR2004", # not applicable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" =[
    "S101",   # asserts are used throughout testing
    "D101",   # decide not to require test class documentation
    "D102",   # decide not to require test method documentation
    "ANN201", # Adding "-> None" is overkill in tests
    "SLF001"  # Tests may access private members
]
