name: Build documentation pages

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  build-docs:
    name: Build documentation pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install with doc dependencies
        run: uv sync --locked --no-default-groups --group docs

      - name: Build sphinx documentation
        run: uv run --locked --no-default-groups --group docs sphinx-build -W -b html docs docs/_build/html

      - name: Upload documentation pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
