[project]
name = "quiche"
version = "0.0.1"
description = "QUantum Integrated CHEmistry toolkit."
authors = [
    { name = "Thomas Bromley", email = "thomas@quantummotion.tech"},
    { name = "Annina Lieberherr", email = "annina@quantummotion.tech"},
    { name = "Vasco Ferreira", email = "vasco.ferreira@quantummotion.tech"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

# need explicit upper bound due to poetry
requires-python=">=3.12, <4.0"

dependencies = [
    "cirq-core>=1.3",
    "h5py>=3.12",
    "numpy>=2.1, <=2.4",    # required for transitive dependencies
    "pydantic>=2.11",
    "qualtran>=0.6",
    "sympy>=1.12.0",
]

[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.11"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.15",
]
test = [
    "pytest>=9.0",
    "scipy>=1.15",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/"
wheel.packages = ["python/src/quiche"]
wheel.py-api = "cp312"
install.components = ["quiche_wheel"]

[tool.scikit-build.cmake.define]
QUICHE_BUILD_BINDINGS = "ON"
BUILD_SHARED_LIBS = "ON"
FLOAT_PRECISION = "2"
ENABLE_MULTITHREADING = "ON"
ENABLE_DISTRIBUTION = "OFF"

[tool.uv]
compile-bytecode = true

[tool.ruff]
src = ["python", "python/src"]
extend-exclude = ["*.pyi"]    # Ignore auto-generated stubs
lint.select = ["ALL"]
lint.ignore = [
    "T20",    # flake8-print
    "AIR",    # Airflow (not applicable)
    "FAST",   # FastAPI (not applicable)
    "D203",   # conflicts with D211
    "D212",   # conflicts with D213
    "COM812", # conflicts with formatter
    "TD003",   # not applicable
    "FIX002",  # not applicable
    "PLR2004", # not applicable
]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" =[
    "S101",   # asserts are used throughout testing
    "D101",   # decide not to require test class documentation
    "D102",   # decide not to require test method documentation
    "ANN201", # Adding "-> None" is overkill in tests
    "SLF001"  # Tests may access private members
]

[tool.pytest]
testpaths = ["python/tests"]

[tool.cibuildwheel]
# Transitive dependency on llvmlite, which doesn't publish wheels for musl.
# Building from sdist would require a full LLVM install.
skip = "*-musllinux_*"
test-command = "pytest {project}/python/tests/test_bindings.py"
test-groups = ["test"]
build = ["cp312-*"]
build-frontend = "build[uv]"

[tool.cibuildwheel.macos]
before-all = "brew install libomp"
environment = { OpenMP_ROOT = "$(brew --prefix libomp)", MACOSX_DEPLOYMENT_TARGET = "15.0" }
